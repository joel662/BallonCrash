<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Balloon Rush</h1>
    <div class="wallet">
      <span class="wallet-label">Balance:</span>
      <span class="wallet-amount">$<span id="wallet-amount">1000.00</span></span>
      <button id="add-funds-btn" title="Add Funds">+</button>
    </div>
  </header>

  <div class="crash-strip-container">
    <div class="crash-strip" id="crash-strip"></div>
  </div>

  <main>
    <div class="game-area">
      <canvas id="crash-canvas" width="700" height="400"></canvas>
    </div>

    <div class="controls-panel">
      <div class="bet-section">
        <label class="section-label">Bet Amount</label>
        <div class="bet-input-row">
          <button class="bet-adjust" id="bet-half">&frac12;</button>
          <input type="number" id="bet-amount" value="10" min="1" step="1">
          <button class="bet-adjust" id="bet-double">2&times;</button>
        </div>
        <div class="quick-bets">
          <button class="quick-bet" data-amount="5">$5</button>
          <button class="quick-bet" data-amount="10">$10</button>
          <button class="quick-bet" data-amount="25">$25</button>
          <button class="quick-bet" data-amount="50">$50</button>
          <button class="quick-bet" data-amount="100">$100</button>
        </div>
      </div>

      <div class="auto-section">
        <label class="section-label">Auto Cash Out</label>
        <input type="number" id="auto-cashout" step="0.1" min="1.1" placeholder="Disabled">
      </div>

      <div class="shield-section">
        <label class="section-label">Power-Up</label>
        <button id="buy-shield-btn" class="shield-btn">Buy Shield — $100</button>
        <div class="shield-desc">50% chance to save your bet if you pop</div>
      </div>

      <button id="action-btn" class="action-btn bet-state">Launch Balloon</button>

      <div id="round-info" class="round-info"></div>

      <div class="history-section">
        <label class="section-label">Round History</label>
        <div id="history-list" class="history-list">No rounds yet</div>
      </div>

      <div class="stats-section">
        <label class="section-label">Session Stats</label>
        <div id="stats-display" class="stats-display">
          <div class="stat-row"><span>Rounds</span><span id="stat-played">0</span></div>
          <div class="stat-row"><span>Win Rate</span><span id="stat-winrate">0%</span></div>
          <div class="stat-row"><span>Profit</span><span id="stat-profit">$0.00</span></div>
          <div class="stat-row"><span>Best</span><span id="stat-best">-</span></div>
        </div>
      </div>
    </div>
  </main>

  <div class="info-bar">
    <span>Provably Fair RNG &bull; RTP: 97%</span>
    <span>Press <kbd>Space</kbd> to bet / cash out</span>
  </div>

  <div id="add-funds-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3>Add Funds</h3>
      <div class="fund-buttons">
        <button class="fund-btn" data-amount="100">+$100</button>
        <button class="fund-btn" data-amount="500">+$500</button>
        <button class="fund-btn" data-amount="1000">+$1,000</button>
      </div>
      <div class="custom-fund">
        <input type="number" id="custom-amount" min="1" placeholder="Custom amount...">
        <button id="custom-fund-btn">Add</button>
      </div>
      <button id="close-modal-btn" class="close-modal-btn">Close</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
